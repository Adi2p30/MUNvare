<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNvare - Delegate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="delegate.css">
</head>
<body>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- ============================================================
         JOIN SCREEN
    ============================================================ -->
    <div id="join-screen">
        <div class="join-card">
            <div class="join-logo">
                <span class="join-logo-text">MUNvare</span>
                <span class="join-logo-sub">Delegate Interface</span>
            </div>

            <div class="join-form">
                <div class="form-group">
                    <label class="form-label" for="room-code-input">Room Code</label>
                    <input
                        id="room-code-input"
                        type="text"
                        class="input-field"
                        placeholder="e.g. ABC123"
                        autocomplete="off"
                        autocapitalize="characters"
                        maxlength="12"
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="country-input">Your Country</label>
                    <input
                        id="country-input"
                        type="text"
                        class="input-field"
                        placeholder="e.g. Germany"
                        autocomplete="off"
                    >
                </div>
                <button class="btn btn-primary btn-join" onclick="joinRoom()">
                    Join Room
                </button>
            </div>

            <p class="join-hint">Ask your chair for the room code.</p>
        </div>
    </div>

    <!-- ============================================================
         MAIN VIEW
    ============================================================ -->
    <div id="main-view" style="display:none;">

        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="committee-name" id="committee-name">Committee</div>
                <div class="delegate-info">
                    <span id="my-country">Country</span>
                    <span class="room-code-badge" id="room-code-badge">----</span>
                </div>
            </div>
            <div class="top-bar-right">
                <span class="status-badge" id="committee-status">IDLE</span>
            </div>
        </header>

        <!-- Timer Display -->
        <div class="timer-block" id="main-timer">
            <div class="timer-label">Session</div>
        </div>

        <!-- Current Activity Panel -->
        <section class="activity-panel" id="current-activity">
            <div class="activity-header">Waiting for session to start...</div>
        </section>

        <!-- Action Buttons -->
        <section class="actions-panel">

            <!-- Speak / Non-voting actions -->
            <div id="speak-actions">
                <div class="action-row">
                    <button class="action-btn action-primary" onclick="requestToSpeak()">
                        <span class="action-icon">🎤</span>
                        <span class="action-label">Request to Speak</span>
                    </button>
                    <button class="action-btn action-secondary" onclick="withdrawFromList()">
                        <span class="action-icon">✖</span>
                        <span class="action-label">Withdraw from List</span>
                    </button>
                </div>

                <div class="action-row">
                    <button class="action-btn action-motion" onclick="proposeMotion()">
                        <span class="action-icon">📋</span>
                        <span class="action-label">Propose Motion</span>
                    </button>
                    <button class="action-btn action-point" onclick="raisePoint()">
                        <span class="action-icon">✋</span>
                        <span class="action-label">Raise Point</span>
                    </button>
                </div>

                <div class="action-row">
                    <button class="action-btn action-reply" onclick="requestRightOfReply()">
                        <span class="action-icon">↩</span>
                        <span class="action-label">Right of Reply</span>
                    </button>
                    <button class="action-btn action-doc" onclick="submitWorkingPaper()">
                        <span class="action-icon">📄</span>
                        <span class="action-label">Submit Working Paper</span>
                    </button>
                </div>
            </div>

            <!-- Voting actions (shown during voting) -->
            <div id="voting-actions" style="display:none;">
                <div class="voting-header">Cast Your Vote</div>
                <div id="vote-buttons" class="vote-grid">
                    <button class="vote-btn vote-for" onclick="castVote('for')">FOR</button>
                    <button class="vote-btn vote-against" onclick="castVote('against')">AGAINST</button>
                    <button class="vote-btn vote-abstain" onclick="castVote('abstain')">ABSTAIN</button>
                    <button class="vote-btn vote-pass" onclick="castVote('pass')">PASS</button>
                </div>
            </div>

        </section>

        <!-- Info Tabs -->
        <section class="info-section">
            <nav class="info-tabs">
                <button class="info-tab-btn active" data-info-tab="speakers" onclick="switchInfoTab('speakers')">
                    Speakers
                </button>
                <button class="info-tab-btn" data-info-tab="announcements" onclick="switchInfoTab('announcements')">
                    Announcements
                </button>
                <button class="info-tab-btn" data-info-tab="documents" onclick="switchInfoTab('documents')">
                    Documents
                </button>
            </nav>

            <div class="info-tab-content" id="info-speakers">
                <div id="speaker-list">
                    <p class="empty">No speakers in list</p>
                </div>
            </div>

            <div class="info-tab-content" id="info-announcements" style="display:none;">
                <div id="announcements-list">
                    <p class="empty">No announcements</p>
                </div>
            </div>

            <div class="info-tab-content" id="info-documents" style="display:none;">
                <div id="documents-list">
                    <p class="empty">No documents</p>
                </div>
            </div>
        </section>

    </div><!-- /#main-view -->

    <!-- ============================================================
         MODAL: Propose Motion
    ============================================================ -->
    <div id="motion-modal" class="modal-overlay" style="display:none;" onclick="handleOverlayClick(event,'motion-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">Propose Motion</h2>
                <button class="modal-close" onclick="closeModal('motion-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Motion Type</label>
                    <select id="motion-type" class="input-field select-field">
                        <option value="mod_caucus">Moderated Caucus</option>
                        <option value="unmod_caucus">Unmoderated Caucus</option>
                        <option value="closure_debate">Closure of Debate</option>
                        <option value="suspension">Suspension of Session</option>
                        <option value="adjournment">Adjournment of Session</option>
                    </select>
                </div>
                <div id="motion-dynamic-fields">
                    <!-- Populated by updateMotionFields() -->
                    <input type="text" id="motion-topic" placeholder="Topic" class="input-field">
                    <div class="form-row">
                        <label class="form-label-inline">Total time (s):
                            <input type="number" id="motion-total-time" value="300" class="input-field input-small">
                        </label>
                        <label class="form-label-inline">Speaker time (s):
                            <input type="number" id="motion-speaker-time" value="60" class="input-field input-small">
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('motion-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="submitMotion()">Propose</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         MODAL: Raise Point
    ============================================================ -->
    <div id="point-modal" class="modal-overlay" style="display:none;" onclick="handleOverlayClick(event,'point-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">Raise a Point</h2>
                <button class="modal-close" onclick="closeModal('point-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Point Type</label>
                    <select id="point-type" class="input-field select-field">
                        <option value="point_of_order">Point of Order</option>
                        <option value="point_of_inquiry">Point of Inquiry</option>
                        <option value="point_of_information">Point of Information</option>
                        <option value="point_of_personal_privilege">Point of Personal Privilege</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Details (optional)</label>
                    <textarea id="point-details" class="input-field textarea-field" placeholder="Describe the point..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('point-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="submitPoint()">Raise Point</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         MODAL: Submit Working Paper
    ============================================================ -->
    <div id="wp-modal" class="modal-overlay" style="display:none;" onclick="handleOverlayClick(event,'wp-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">Submit Working Paper</h2>
                <button class="modal-close" onclick="closeModal('wp-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input id="wp-title" type="text" class="input-field" placeholder="Working paper title">
                </div>
                <div class="form-group">
                    <label class="form-label">Sponsors (comma-separated)</label>
                    <input id="wp-sponsors" type="text" class="input-field" placeholder="e.g. Germany, France">
                </div>
                <div class="form-group">
                    <label class="form-label">Signatories (comma-separated)</label>
                    <input id="wp-signatories" type="text" class="input-field" placeholder="e.g. Brazil, India">
                </div>
                <div class="form-group">
                    <label class="form-label">Content / Summary</label>
                    <textarea id="wp-content" class="input-field textarea-field" placeholder="Operative clauses, notes, or summary..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('wp-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="submitWP()">Submit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="delegate.js"></script>
</body>
</html>
